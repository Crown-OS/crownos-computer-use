[package]
name = "crownos-events"
description = "Follows the computer-use daemon's events as JSON lines, for agent hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "crownos-events"
path = "src/main.rs"

[dependencies]
crownos-computer-use-protocol = { workspace = true }
crownos-ipc = { workspace = true, features = ["tokio"] }

anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal"] }

[lints]
workspace = true
